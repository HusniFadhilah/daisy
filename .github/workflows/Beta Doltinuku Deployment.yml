name: Beta Doltinuku Deployment

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v7

      - name: Prepare deployment files
        run: |
          mkdir -p .deploy
          rsync -a ./ .deploy/ \
            --exclude=".deploy/" \
            --exclude="vendor/" \
            --exclude=".vscode/" \
            --exclude="public/assets/plugins/" \
            --exclude="public/gs/" \
            --exclude=".git/" \
            --exclude="node_modules/"

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Sync files using SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_DOLTINUKU_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_DOLTINUKU_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_DOLTINUKU_PASSWORD }}
          SFTP_REMOTE_DIR: /home/doltinuku/daisy
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" -p 22 "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          mkdir -p "$SFTP_REMOTE_DIR"
          mirror -R --verbose .deploy "$SFTP_REMOTE_DIR"
          bye
          EOF
