name: Beta Dev Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" \
            "sftp://${{ secrets.FTP_SERVER }}:${{ secrets.FTP_PORT }}" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 20

          mirror --reverse \
            --verbose \
            --overwrite \
            --no-perms \
            --exclude-glob vendor/** \
            --exclude-glob .vscode/** \
            --exclude-glob public/assets/plugins/** \
            --exclude-glob public/gs/** \
            --exclude-glob .git/** \
            --exclude-glob .github/** \
            --exclude-glob .env \
            --exclude-glob .env.* \
            --exclude-glob node_modules/** \
            --exclude-glob bootstrap/cache \
            --exclude-glob bootstrap/cache/** \
            --exclude-glob .claude/** \
            --exclude-glob storage/debugbar \
            --exclude-glob storage/debugbar/** \
            --exclude-glob storage/framework \
            --exclude-glob storage/framework/** \
            --exclude-glob storage/logs \
            --exclude-glob storage/logs/** \
            --exclude-glob tests/** \
            --exclude-glob **/tests/** \
            ./ /home/ubuntu/daisy/daisy-dev

          bye
          EOF
