name: Beta Deployment

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Install dependencies termasuk devDependencies
      # - name: Install Dependencies
      #   run: npm ci

      # Build Vite
      # - name: Build Assets
      #   run: npm run build

      # - name: Remove node_modules before upload
      #   run: rm -rf node_modules

      # Cleanup Laravel cache
      - name: Install deployment tools
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync files using SFTP
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
          SFTP_PATH: /home/ubuntu/daisy/daisy
        run: |
          lftp <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 3
          set net:timeout 30
          open -u "${SFTP_USER},${SFTP_PASS}" -p "${SFTP_PORT}" "sftp://${SFTP_HOST}"
          mirror --reverse --delete --verbose \
            --exclude-glob vendor/** \
            --exclude-glob .vscode/** \
            --exclude-glob public/assets/plugins/** \
            --exclude-glob public/gs/** \
            --exclude-glob .git/** \
            --exclude-glob node_modules/** \
            --exclude-glob bootstrap/cache/** \
            --exclude-glob .claude/** \
            --exclude-glob tests/** \
            --exclude-glob **/tests/** \
            ./ "${SFTP_PATH}"
          bye
          EOF
