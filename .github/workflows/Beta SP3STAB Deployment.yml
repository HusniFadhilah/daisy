name: Beta SP3STAB Deployment

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          mkdir -p .deploy
          rsync -a ./ .deploy/ \
            --exclude=".deploy/" \
            --exclude="vendor/" \
            --exclude=".vscode/" \
            --exclude="public/assets/plugins/" \
            --exclude="public/gs/" \
            --exclude=".git/" \
            --exclude="node_modules/"

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SFTP_SP3STAB_SERVER }}
          username: ${{ secrets.SFTP_SP3STAB_USERNAME }}
          password: ${{ secrets.SFTP_SP3STAB_PASSWORD }}
          port: 22
          script: |
            mkdir -p /var/www/sipenahana/daisy
            test -w /var/www/sipenahana/daisy

      - name: Sync files using SFTP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SFTP_SP3STAB_SERVER }}
          username: ${{ secrets.SFTP_SP3STAB_USERNAME }}
          password: ${{ secrets.SFTP_SP3STAB_PASSWORD }}
          port: 22
          source: ".deploy"
          target: "/var/www/sipenahana/daisy"
          overwrite: true
          rm: false
          strip_components: 1
          debug: true
